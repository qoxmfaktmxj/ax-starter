name: ax-starter

x-local-env: &local-env
  APP_PROFILE: local
  APP_ORIGIN: http://host.docker.internal:3000
  OIDC_ISSUER: http://host.docker.internal:8090/default
  OIDC_CLIENT_ID: ax-starter
  OIDC_CLIENT_SECRET: local-secret
  BETTER_AUTH_SECRET: local-only-change-before-any-nonlocal-use-0123456789
  DATABASE_URL: postgres://ax:ax@db:5432/ax_local
  FILE_ROOT: /data/files
  LOCAL_FIXTURE_PASSWORD: local-fixture-pass-2026
  NEXT_TELEMETRY_DISABLED: '1'

x-test-env: &test-env
  APP_PROFILE: test
  APP_ORIGIN: http://test-web:3000
  OIDC_ISSUER: http://test-oidc:8080/default
  OIDC_CLIENT_ID: ax-starter
  OIDC_CLIENT_SECRET: local-secret
  BETTER_AUTH_SECRET: isolated-test-secret-012345678901234567890
  DATABASE_URL: postgres://ax:ax@test-db:5432/ax_e2e
  FILE_ROOT: /data/files
  LOCAL_FIXTURE_PASSWORD: local-fixture-pass-2026
  NEXT_TELEMETRY_DISABLED: '1'

services:
  db:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    profiles: [local]
    environment:
      POSTGRES_USER: ax
      POSTGRES_PASSWORD: ax
      POSTGRES_DB: ax_local
    volumes:
      - local-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ax -d ax_local']
      interval: 3s
      retries: 20

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.3@sha256:876229d27fc99d7b1ab00dcd64a59a8c10826a6260b68f042558d83a0323dfb7
    profiles: [local]
    hostname: host.docker.internal
    ports: ['8090:8090']
    environment:
      JSON_CONFIG_PATH: /config/config.json
      SERVER_PORT: '8090'
    volumes:
      - ./infra/oidc/config.json:/config/config.json:ro

  init-files:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    profiles: [local]
    user: '0:0'
    command: sh -c 'mkdir -p /data/files && touch /data/files/.ax-storage-marker && chown -R 10001:10001 /data/files'
    volumes:
      - local-files:/data/files

  migrate:
    build:
      context: .
      target: tools
    profiles: [local]
    environment: *local-env
    command: pnpm migrate
    depends_on:
      db: { condition: service_healthy }

  seed:
    build:
      context: .
      target: tools
    profiles: [local]
    environment: *local-env
    command: pnpm seed
    depends_on:
      db: { condition: service_healthy }

  web:
    image: ax-starter-runtime:local
    build:
      context: .
      target: runtime
    profiles: [local]
    environment: *local-env
    ports: ['3000:3000']
    volumes:
      - local-files:/data/files
    depends_on:
      db: { condition: service_healthy }
      oidc: { condition: service_started }
      init-files: { condition: service_completed_successfully }

  worker:
    image: ax-starter-runtime:local
    profiles: [local]
    environment: *local-env
    command: node --import tsx apps/worker/index.ts
    volumes:
      - local-files:/data/files
    depends_on:
      db: { condition: service_healthy }
      init-files: { condition: service_completed_successfully }

  tools:
    build:
      context: .
      target: tools
    profiles: [local]
    environment: *local-env
    volumes:
      - local-files:/data/files
    depends_on:
      db: { condition: service_healthy }

  test-db:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    profiles: [test]
    environment:
      POSTGRES_USER: ax
      POSTGRES_PASSWORD: ax
      POSTGRES_DB: postgres
    volumes:
      - test-db:/var/lib/postgresql
      - ./infra/postgres/test-init.sql:/docker-entrypoint-initdb.d/test-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ax -d ax_e2e']
      interval: 3s
      retries: 20

  test-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.3@sha256:876229d27fc99d7b1ab00dcd64a59a8c10826a6260b68f042558d83a0323dfb7
    profiles: [test]
    hostname: test-oidc
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./infra/oidc/config.json:/config/config.json:ro

  test-init-files:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    profiles: [test]
    user: '0:0'
    command: sh -c 'mkdir -p /data/files && touch /data/files/.ax-storage-marker && chown -R 10001:10001 /data/files'
    volumes:
      - test-files:/data/files

  test-setup-e2e:
    build:
      context: .
      target: tools
    profiles: [test]
    environment: *test-env
    command: sh -c 'pnpm migrate && pnpm seed'
    depends_on:
      test-db: { condition: service_healthy }

  test-web:
    image: ax-starter-runtime:test
    build:
      context: .
      target: runtime
    profiles: [test]
    environment: *test-env
    volumes:
      - test-files:/data/files
    depends_on:
      test-db: { condition: service_healthy }
      test-oidc: { condition: service_started }
      test-init-files: { condition: service_completed_successfully }
      test-setup-e2e: { condition: service_completed_successfully }

  test-worker:
    image: ax-starter-runtime:test
    profiles: [test]
    environment: *test-env
    command: node --import tsx apps/worker/index.ts
    volumes:
      - test-files:/data/files
    depends_on:
      test-db: { condition: service_healthy }
      test-init-files: { condition: service_completed_successfully }
      test-setup-e2e: { condition: service_completed_successfully }

  test:
    build:
      context: .
      target: tools
    profiles: [test]
    environment:
      <<: *test-env
      DATABASE_URL: postgres://ax:ax@test-db:5432/ax_integration
    volumes:
      - test-files:/data/files
      - ./output:/app/output
      - ./output/playwright-test:/app/test-results
    depends_on:
      test-db: { condition: service_healthy }
      test-init-files: { condition: service_completed_successfully }

volumes:
  local-db:
  local-files:
  test-db:
  test-files:
